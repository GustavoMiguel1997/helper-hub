spring.application.name=api

# Plataformas de hospedagem podem fornecer PORT; execução local usa 8080.
server.port=${PORT:8080}

# Alinhar com io.helperhub.api.audio.validation.AudioUploadSpecifications.MAX_UPLOAD_BYTES
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Duração máxima do trecho de corte (endMs - startMs), em milissegundos (padrão: 30 minutos)
helperhub.audio.max-cut-duration-ms=1800000
# Requisições por minuto por cliente (IP da conexão) em /api/audio/**
helperhub.audio.max-requests-per-minute=60
helperhub.audio.rate-limit-enabled=true

# Chave X-Api-Key da remove.bg (https://www.remove.bg/api) — necessária para POST /api/image/remove-background
helperhub.image.remove-bg-api-key=
# Requisições por minuto por cliente em /api/image/**
helperhub.image.max-requests-per-minute=30
helperhub.image.rate-limit-enabled=true
# Lado máximo (largura ou altura) em pedidos de resize (maxWidth / maxHeight)
helperhub.image.max-resize-output-side=8192
# Qualidade JPEG padrão (0.0–1.0) quando jpegQuality não for enviado
helperhub.image.default-jpeg-output-quality=0.85

# Requisições por minuto por cliente em /api/video/**
helperhub.video.max-requests-per-minute=20
helperhub.video.rate-limit-enabled=true
# Comando para executar o yt-dlp (ex.: yt-dlp, yt-dlp.exe ou caminho absoluto)
helperhub.video.yt-dlp-command=yt-dlp
# Timeout máximo para baixar/processar vídeo do YouTube (segundos)
helperhub.video.max-download-duration-seconds=900

# Limites por instância. Não confiar em cabeçalhos enviados diretamente pelo cliente.
server.forward-headers-strategy=none
helperhub.processing.max-concurrent=4
helperhub.audio.max-processing-seconds=120
helperhub.audio.max-edit-duration-ms=1800000
helperhub.image.max-input-pixels=25000000
helperhub.video.max-download-bytes=262144000
helperhub.video.max-video-duration-seconds=1800

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
